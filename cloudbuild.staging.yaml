# Staging: FE repo only (Dockerfile at repo root). THE_S = Terraform/docker-compose; copy this file
# into your Next.js repo (e.g. cloudbuild.staging.yaml) and wire the trigger there.
# Artifact Registry: terraform default the-s-api-staging (or a dedicated FE docker repo).
# Set _NEXT_PUBLIC_API_URL to the public API base URL (https://...).

substitutions:
  _REGION: asia-southeast1
  _AR_REPOSITORY: the-s-api-staging
  _CLOUD_RUN_SERVICE: the-s-fe-staging
  _NEXT_PUBLIC_API_URL: ""
  _NEXT_PUBLIC_MAPBOX_TOKEN: ""
  _FE_BUILD_DIR: "."

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s

steps:
  - id: docker-build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        echo "docker-build: context=${_FE_BUILD_DIR}"
        docker build \
          --build-arg "NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}" \
          --build-arg "NEXT_PUBLIC_MAPBOX_TOKEN=${_NEXT_PUBLIC_MAPBOX_TOKEN}" \
          -f "${_FE_BUILD_DIR}/Dockerfile" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/fe:${SHORT_SHA}" \
          -t "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/fe:staging-latest" \
          "${_FE_BUILD_DIR}"

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/fe

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    args:
      - gcloud
      - run
      - deploy
      - ${_CLOUD_RUN_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/fe:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet
      - --set-env-vars=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL},API_URL=${_NEXT_PUBLIC_API_URL}

  - id: cleanup-revisions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run revisions list \
          --service=${_CLOUD_RUN_SERVICE} \
          --region=${_REGION} \
          --format="value(REVISION)" \
          --sort-by=~creationTimestamp | tail -n +3 | while read -r rev; do
            echo "Deleting old revision: $${rev}"
            gcloud run revisions delete "$${rev}" --region=${_REGION} --quiet || true
          done

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/fe:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/fe:staging-latest
